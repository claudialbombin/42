[tool.poetry]
name = "exercise"
version = "0.1.0"
description = "Matrix data loading exercise (pip vs Poetry demo)"
# We only use Poetry to manage dependencies, this is not a package to
# build: without this, 'poetry install' fails looking for the project.
package-mode = false
authors = ["Claudia <claudialbombin@gmail.com>"]

[tool.poetry.dependencies]
python = "^3.10"
numpy = "^1.25"
pandas = "^2.0"
matplotlib = "^3.7"
requests = "^2.31"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
